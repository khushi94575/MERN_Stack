<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Promise.all Demo</h2>
    <button onclick="LoadData()">Load data</button>
    <div class="output"></div>
    <script>
        async function LoadData(){
            try {
                const userAPI = fetch("https://jsonplaceholder.typicode.com/users/1");
                const postAPI = fetch("https://jsonplaceholder.typicode.com/posts/1");
                const commentAPI = fetch("https://jsonplaceholder.typicode.com/comments/1");

                let responses = await Promise.all([userAPI, postAPI, commentAPI]);
                
                let [user, post, comment] = await Promise.all([
                    responses[0].json(),
                    responses[1].json(),
                    responses[2].json()
                ]);

                document.querySelector(".output").innerHTML = `
                    <p>User Name: ${user.name}</p>
                    <p>Post Title: ${post.title}</p>
                    <p>Comment Email: ${comment.email}</p>
                `;
            } catch (error) {
                console.error("Failed to load data:", error);
                document.querySelector(".output").innerHTML = "<p>Error loading data.</p>";
            }
        }
    </script>
</body>
</html>
