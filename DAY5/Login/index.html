<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="signup-card">
            <div class="row g-0">

                <!-- Left Side Image -->
                <div class="col-lg-6 image-side">
                    <img src="desert.jpeg" alt="Signup Image" class="img-fluid h-100 w-100" ;>

                    <div class="overlay-text">
                        <h2>Capturing Moments,<br>Creating Memories</h2>
                    </div>
                </div>

                <!-- Right Side Form -->
                <div class="col-lg-6 p-5">

                    <h1>Login</h1>

                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Email">
                    </div>

                    <div class="input-group mb-3">
                        <input type="password" class="form-control" placeholder="Password">

                        <span class="input-group-text">
                            <i class="bi bi-eye"></i>
                        </span>
                    </div>



                    <button class="btn btn-purple w-100">
                        Login
                    </button>

                    <div class="divider">
                        <span>Or sign in with</span>
                    </div>

                    <div class="row mt-4">

                        <div class="col">
                            <button class="btn social-btn w-100">
                                <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" width="20"
                                    class="me-2">
                                Google
                            </button>
                        </div>

                        <div class="col">
                            <button class="btn social-btn w-100">
                                <i class="bi bi-apple me-2"></i>
                                Apple
                            </button>
                        </div>

                    </div>

                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
